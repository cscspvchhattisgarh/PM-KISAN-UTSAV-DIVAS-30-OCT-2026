<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM-KISAN UTSAV DIVAS (30 OCT 2026)</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-dark: #212529;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --focus-ring: rgba(13, 110, 253, 0.25);
            --error-color: #dc3545;
            --success-color: #198754;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        .header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 15px;
            font-weight: 600;
            opacity: 0.95;
            letter-spacing: 1px;
        }

        /* WELCOME POPUP STYLING */
        .welcome-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 15px;
        }

        .welcome-modal-box {
            background: #ffffff;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: modalFadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 6px solid #0d6efd;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .welcome-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .welcome-modal-box h3 {
            margin: 0 0 12px 0;
            color: #0d6efd;
            font-size: 20px;
            font-weight: 700;
        }

        .welcome-modal-box p {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            margin: 0 0 24px 0;
            font-weight: 500;
        }

        .welcome-close-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            transition: all 0.2s ease;
        }

        .welcome-close-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(13, 110, 253, 0.4);
        }

        /* QUICK LINKS SECTION STYLING */
        .links-container {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 25px 0 25px;
        }

        .links-title {
            font-size: 14px;
            font-weight: 700;
            color: #0a58ca;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .link-item:last-child {
            margin-bottom: 0;
        }

        .link-item:hover {
            border-color: #0d6efd;
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.1);
        }

        .link-item a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .link-item a:hover {
            text-decoration: underline;
        }

        form {
            padding: 25px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #0d6efd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            form {
                padding: 20px 15px;
            }
            .links-container {
                margin: 15px 15px 0 15px;
            }
            .link-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .form-group.full-width {
                grid-column: span 1;
            }
        }

            display: block;
            font-weight: 600;
            margin
