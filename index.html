<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM-KISAN UTSAV DIVAS (30 OCT 2026)</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #ced4da;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 10px;
        }

        .card {
            max-width: 650px;
            background: var(--card-bg);
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        .header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        form {
            padding: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 5px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 576px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        @media (max-width: 576px) {
            .form-group.full-width {
                grid-column: span 1;
            }
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
            color: #495057;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        input:disabled, select:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .loading-text {
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>PM-KISAN UTSAV DIVAS</h2>
        <p>30 OCTOBER 2026 — DATA COLLECTION FORM</p>
    </div>

    <form id="dataForm">
        <!-- Section 1: Location -->
        <div class="section-title">1. Location Selection</div>
        <div class="grid-container">
            <div class="form-group full-width">
                <label>District Name / जिला *</label>
                <select id="district" name="districtName" required>
                    <option value="">Loading Data...</option>
                </select>
                <input type="hidden" id="districtCode" name="districtCode">
            </div>

            <div class="form-group">
                <label>Block Name / ब्लॉक *</label>
                <select id="block" name="blockName" required disabled>
                    <option value="">Select Block</option>
                </select>
                <input type="hidden" id="blockCode" name="blockCode">
            </div>

            <div class="form-group">
                <label>Grampanchayat Name / ग्राम पंचायत *</label>
                <select id="gp" name="gpName" required disabled>
                    <option value="">Select Grampanchayat</option>
                </select>
                <input type="hidden" id="gpCode" name="gpCode">
            </div>
        </div>

        <!-- Section 2: VLE Details -->
        <div class="section-title" style="margin-top: 15px;">2. VLE Information</div>
        <div class="grid-container">
            <div class="form-group">
                <label>CSC ID *</label>
                <input type="text" name="cscId" placeholder="Enter CSC ID" required>
            </div>

            <div class="form-group">
                <label>VLE Name *</label>
                <input type="text" name="vleName" placeholder="Enter VLE Name" required>
            </div>

            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" name="mobile" pattern="[0-9]{10}" placeholder="10 Digit Mobile No." required>
            </div>

            <div class="form-group">
                <label>Email ID *</label>
                <input type="email" name="email" placeholder="example@domain.com" required>
            </div>

            <div class="form-group full-width">
                <label>अनुमानित किसानों की संख्या (Estimated Farmers Count) *</label>
                <input type="number" name="farmersCount" min="0" placeholder="Enter Number of Farmers" required>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit Responses</button>
        <div id="message"></div>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyY9wgDTwRsbAK4Hbhr4_Yq04JGekJLTYyCI3mDI_ObIb_LtFGrDhPZUAdOKYctn78kbg/exec"; // Yahan App Script URL lagayein

    let masterData = {};

    // Single Fetch on Load (Fast Dropdown Loading)
    window.onload = function() {
        fetch(`${SCRIPT_URL}?action=getHierarchy`)
            .then(res => res.json())
            .then(data => {
                masterData = data;
                let distSelect = document.getElementById('district');
                distSelect.innerHTML = '<option value="">Select District</option>';
                
                for (let dist in data) {
                    distSelect.innerHTML += `<option value="${dist}">${dist}</option>`;
                }
            })
            .catch(err => {
                console.error("Error loading hierarchy:", err);
                document.getElementById('district').innerHTML = '<option value="">Error Loading Data</option>';
            });
    };

    // Fast Instant Dropdown Updates (Client Side)
    document.getElementById('district').addEventListener('change', function() {
        let dist = this.value;
        let blockSelect = document.getElementById('block');
        let gpSelect = document.getElementById('gp');

        blockSelect.innerHTML = '<option value="">Select Block</option>';
        gpSelect.innerHTML = '<option value="">Select Grampanchayat</option>';
        gpSelect.disabled = true;

        if (dist && masterData[dist]) {
            document.getElementById('districtCode').value = masterData[dist].code || '';
            blockSelect.disabled = false;
            
            let blocks = masterData[dist].blocks;
            for (let block in blocks) {
                blockSelect.innerHTML += `<option value="${block}">${block}</option>`;
            }
        } else {
            blockSelect.disabled = true;
            document.getElementById('districtCode').value = '';
        }
    });

    document.getElementById('block').addEventListener('change', function() {
        let dist = document.getElementById('district').value;
        let block = this.value;
        let gpSelect = document.getElementById('gp');

        gpSelect.innerHTML = '<option value="">Select Grampanchayat</option>';

        if (dist && block && masterData[dist].blocks[block]) {
            document.getElementById('blockCode').value = masterData[dist].blocks[block].code || '';
            gpSelect.disabled = false;

            let gps = masterData[dist].blocks[block].gps;
            for (let gp in gps) {
                gpSelect.innerHTML += `<option value="${gp}">${gp}</option>`;
            }
        } else {
            gpSelect.disabled = true;
            document.getElementById('blockCode').value = '';
        }
    });

    document.getElementById('gp').addEventListener('change', function() {
        let dist = document.getElementById('district').value;
        let block = document.getElementById('block').value;
        let gp = this.value;

        if (dist && block && gp && masterData[dist].blocks[block].gps[gp]) {
            document.getElementById('gpCode').value = masterData[dist].blocks[block].gps[gp] || '';
        } else {
            document.getElementById('gpCode').value = '';
        }
    });

    // Form Submit Action
    document.getElementById('dataForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let btn = document.getElementById('submitBtn');
        let msg = document.getElementById('message');

        btn.disabled = true;
        msg.style.color = '#0d6efd';
        msg.innerText = "Submitting data...";

        let formData = new FormData(this);
        fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(response => {
                if (response.result === 'success') {
                    msg.style.color = '#198754';
                    msg.innerText = "Data successfully saved!";
                    document.getElementById('dataForm').reset();
                    document.getElementById('block').disabled = true;
                    document.getElementById('gp').disabled = true;
                } else {
                    msg.style.color = '#dc3545';
                    msg.innerText = "Error saving data. Try again.";
                }
                btn.disabled = false;
            })
            .catch(error => {
                msg.style.color = '#dc3545';
                msg.innerText = "Network Error!";
                btn.disabled = false;
            });
    });
</script>

</body>
</html>
